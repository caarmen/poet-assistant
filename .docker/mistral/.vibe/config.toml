skill_paths = [
    "/opt/myproj/.vibe/skills",
]
enabled_tools = [
    "bash",
    "read_file",
    "task",
]
active_model = "devstral-small"
theme = "monokai"
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
allowlist = [
    "./gradlew",
    "/*",
    "/home/vibeuser/.vibe/*",
    "/home/vibeuser/.vibe/plans/*",
    "/tmp/*",
    "adb",
    "awk",
    "basename",
    "cat",
    "cd",
    "chmod",
    "comm",
    "cp",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "find . -name \"*.kt\" -exec grep -l \"provideGetProcessTextMenuItemsUseCase\\|provideOpenExternalAppUseCase\\|GetProcessTextMenuItemsUseCase\\|OpenExternalAppUseCase\" {} \\;",
    "find /opt/myproj -path \"*/.gradle\" -prune -o -path \"*/.docker\" -prune -o -type f -name \"*.kt\" -print 2>/dev/null | head -50",
    "find /opt/myproj/app/src/main -name \"*ListFragment.kt\" -type f 2>/dev/null",
    "find /opt/myproj/app/src/main -name \"*Pattern*\" -type f 2>/dev/null | grep -E \"\\.(kt|java)$\"",
    "find /opt/myproj/app/src/main -name \"ResultListFactory.kt\" -type f 2>/dev/null",
    "find /opt/myproj/app/src/main -path \"*/rt/*\" -name \"*Fragment.kt\" -type f 2>/dev/null",
    "find /opt/myproj/app/src/main -type f -name \"*.kt\" 2>/dev/null | xargs grep -l -i \"pattern\" 2>/dev/null | head -20",
    "find /opt/myproj/src -type f \\( -name \"*.kt\" -o -name \"*.java\" \\) 2>/dev/null | head -100",
    "fmt",
    "fold",
    "git add",
    "git checkout",
    "git commit",
    "git diff",
    "git log",
    "git restore",
    "git show",
    "git stash",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "mkdir",
    "more",
    "nl",
    "od",
    "paste",
    "patch",
    "pwd",
    "python3",
    "readlink",
    "sed",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "uname",
    "uniq",
    "wc",
    "which",
    "xargs",
]

[tools.read_file]
allowlist = [
    "/home/vibeuser/.vibe/plans/*",
]
