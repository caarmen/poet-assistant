skill_paths = [
    "/opt/myproj/.vibe/skills",
]
enabled_tools = [
    "bash",
    "read_file",
    "write_file",
    "edit",
    "task",
]
active_model = "devstral-small"
theme = "monokai"
applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
# We use mistral inside a docker container: set "always" for tools.bash permission.
permission = "always"

